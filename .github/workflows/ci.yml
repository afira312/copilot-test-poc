name: CI and Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required site files
        run: |
          cd src
          test -f index.html
          test -f styles.css
          test -f script.js
          grep -q '<!doctype html>' index.html
          grep -q 'script.js' index.html

      - name: Require feature branch pull requests
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          case "$BRANCH_NAME" in
            feature/*) ;;
            *) echo "Pull requests must come from a feature/* branch"; exit 1 ;;
          esac

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Check for accidental secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-security:
    name: Review workflow security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan GitHub Actions workflows
        uses: zizmorcore/zizmor-action@v0.2.0
        with:
          persona: pedantic
