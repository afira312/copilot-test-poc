name: Issue drift check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to inspect
        required: true
        type: string

permissions:
  contents: read # Read repository contents
  issues: read # Read issue data
  pull-requests: read # Read PR metadata

concurrency:
  group: drift-check-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check issue and PR alignment
    runs-on: ubuntu-latest
    steps:
      - name: Resolve linked issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$HEAD_REF" ]]; then
            HEAD_REF="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')"
          fi
          if [[ ! "$HEAD_REF" =~ ^feature/([0-9]+)(-|$) ]]; then
            echo "Feature branches must use feature/<issue-number>-<short-name>." >&2
            exit 1
          fi
          issue_number="${BASH_REMATCH[1]}"
          gh api "repos/$REPOSITORY/issues/$issue_number" > issue.json
          gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" > pull-request.diff
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"

