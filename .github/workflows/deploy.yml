name: Promote DTAP artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

## add input to select environment (options dev/prod for poc)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dtap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package site
        run: tar -czf site-${{ github.sha }}.tgz src/index.html src/styles.css src/script.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: site-${{ github.sha }}.tgz
          retention-days: 14

  deployment:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest"
    environment: Development # (replace with input.environment || "Development")
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
      - name: Validate Development artifact
        run: tar -tzf site-${{ github.sha }}.tgz | grep -E '^(index.html|styles.css|script.js)$'
      - name: Prepare Pages artifact
        run: mkdir site && tar -xzf site-${{ github.sha }}.tgz -C site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1


